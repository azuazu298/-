<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>minimo-ww</title>
<style>
  :root {
    --primary: #4a90e2;
    --secondary: #f39c12;
    --bg-color: #f7f9fc;
    --text-color: #333;
    --card-bg: #fff;
  }
  
  body {
    margin: 0;
    padding: 0;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  .screen {
    display: none;
    width: 100%;
    max-width: 600px;
    height: 100%;
    background: var(--card-bg);
    box-shadow: 0 0 20px rgba(0,0,0,0.1);
    flex-direction: column;
    position: relative;
  }

  .screen.active {
    display: flex;
    animation: fadeIn 0.3s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Header */
  .header {
    background: var(--primary);
    color: white;
    padding: 15px 20px;
    text-align: center;
    font-size: 1.5em;
    font-weight: bold;
    letter-spacing: 2px;
  }

  /* Content area */
  .content {
    flex: 1;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow-y: auto;
  }

  /* Buttons */
  button {
    background-color: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 15px 20px;
    margin: 10px 0;
    font-size: 1.1em;
    cursor: pointer;
    width: 100%;
    max-width: 400px;
    transition: transform 0.1s, background-color 0.2s;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }

  button:active {
    transform: scale(0.98);
  }

  button:hover {
    background-color: #357abd;
  }

  /* Game Screen Specifics */
  .status-bar {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 400px;
    margin-bottom: 20px;
    font-size: 1.2em;
    font-weight: bold;
    color: var(--secondary);
  }

  .question-box {
    font-size: 2.5em;
    font-weight: bold;
    margin-bottom: 30px;
    text-align: center;
    color: var(--primary);
  }

  .choice-btn {
    background-color: white;
    color: var(--text-color);
    border: 2px solid var(--primary);
    text-align: left;
    font-size: 1em;
    line-height: 1.4;
  }
  .choice-btn:hover {
    background-color: #ebf3fa;
  }

  /* Feedback Animation */
  .feedback {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 10em;
    font-weight: bold;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 10;
  }

  .feedback.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }

  .feedback.correct { color: #2ecc71; }
  .feedback.wrong { color: #e74c3c; }

  /* Results */
  .result-score {
    font-size: 4em;
    color: var(--secondary);
    margin: 20px 0;
    font-weight: bold;
  }
</style>
</head>
<body>

  <!-- Title Screen -->
  <div id="title-screen" class="screen active">
    <div class="header">minimo-ww</div>
    <div class="content">
      <h2 style="color: #666; margin-bottom: 40px;">Guess the Meaning!</h2>
      <button onclick="startApp()">START</button>
      <p style="font-size: 0.8em; color: #999; margin-top: 20px;">※タップするとBGMが鳴ります</p>
    </div>
  </div>

  <!-- Level Select Screen -->
  <div id="level-screen" class="screen">
    <div class="header">Select Level</div>
    <div class="content">
      <button onclick="selectLevel(1)">Level 1 (Beginner)</button>
      <button onclick="selectLevel(2)">Level 2 (Elementary)</button>
      <button onclick="selectLevel(3)">Level 3 (Intermediate)</button>
      <button onclick="selectLevel(4)">Level 4 (Advanced)</button>
      <button onclick="selectLevel(5)">Level 5 (Master)</button>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" class="screen">
    <div class="header" id="game-header">Level 1</div>
    <div class="content">
      <div class="status-bar">
        <span id="q-counter">Q: 1/6</span>
        <span id="score-display">Score: 0</span>
      </div>
      <div class="question-box" id="question-word">Word</div>
      <div id="choices-container" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <!-- Choices will be injected here -->
      </div>
    </div>
    <div id="feedback" class="feedback">⭕️</div>
  </div>

  <!-- Result Screen -->
  <div id="result-screen" class="screen">
    <div class="header">Result</div>
    <div class="content">
      <h2>Your Score</h2>
      <div class="result-score" id="final-score">0 / 6</div>
      <p id="result-message" style="margin-bottom: 30px; font-size: 1.2em;"></p>
      <button onclick="showScreen('level-screen')">Select Level</button>
      <button onclick="showScreen('title-screen'); stopBGM();" style="background-color: #95a5a6;">Back to Title</button>
    </div>
  </div>

<script>
  // --- Audio System (Web Audio API) ---
  let audioCtx = null;
  let bgmInterval = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // 控えめなBGMループ
  function startBGM() {
    if (bgmInterval) return;
    const notes = [261.63, 329.63, 392.00, 523.25]; // C, E, G, C
    let step = 0;
    
    bgmInterval = setInterval(() => {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = notes[step % notes.length] / 2;
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
      step++;
    }, 500);
  }

  function stopBGM() {
    if (bgmInterval) {
      clearInterval(bgmInterval);
      bgmInterval = null;
    }
  }

  function playSE(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'correct') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
      osc.frequency.setValueAtTime(1108.73, audioCtx.currentTime + 0.1); 
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    } else if (type === 'wrong') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.setValueAtTime(100, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    }
  }

  // --- Quiz Data ---
  const wordsData = [
    // Level 1
    { word: "Apple", meaning: "A round fruit with red or green skin and a whitish interior.", level: 1 },
    { word: "Dog", meaning: "A common animal with four legs, often kept by people as a pet.", level: 1 },
    { word: "Book", meaning: "A set of printed pages, bound together in a cover.", level: 1 },
    { word: "Water", meaning: "A clear liquid, without colour or taste, that falls from the sky as rain.", level: 1 },
    { word: "Sun", meaning: "The star that provides light and heat for the earth.", level: 1 },
    { word: "Happy", meaning: "Feeling, showing, or causing pleasure or satisfaction.", level: 1 },
    // Level 2
    { word: "Beautiful", meaning: "Very attractive to look at.", level: 2 },
    { word: "Quickly", meaning: "At a fast speed.", level: 2 },
    { word: "Journey", meaning: "The act of travelling from one place to another.", level: 2 },
    { word: "Friend", meaning: "A person who you know well and who you like a lot.", level: 2 },
    { word: "Important", meaning: "Necessary or of great value.", level: 2 },
    { word: "Decide", meaning: "To choose something, especially after thinking carefully.", level: 2 },
    // Level 3
    { word: "Environment", meaning: "The air, water, and land in or on which people, animals, and plants live.", level: 3 },
    { word: "Experience", meaning: "Knowledge or skill from doing, seeing, or feeling things.", level: 3 },
    { word: "Participate", meaning: "To take part in or become involved in an activity.", level: 3 },
    { word: "Opportunity", meaning: "An occasion or situation that makes it possible to do something.", level: 3 },
    { word: "Communicate", meaning: "To share information with others by speaking, writing, or using signals.", level: 3 },
    { word: "Develop", meaning: "To grow or change into a more advanced, larger, or stronger form.", level: 3 },
    // Level 4
    { word: "Consequently", meaning: "As a result.", level: 4 },
    { word: "Significant", meaning: "Important or noticeable.", level: 4 },
    { word: "Implement", meaning: "To start using a plan or system.", level: 4 },
    { word: "Emphasize", meaning: "To show that something is very important or worth giving attention to.", level: 4 },
    { word: "Contradict", meaning: "To say the opposite of what someone else has said.", level: 4 },
    { word: "Ambiguous", meaning: "Having or expressing more than one possible meaning.", level: 4 },
    // Level 5
    { word: "Ubiquitous", meaning: "Seeming to be everywhere.", level: 5 },
    { word: "Ephemeral", meaning: "Lasting for only a short time.", level: 5 },
    { word: "Sycophant", meaning: "Someone who praises powerful people in a way that is not sincere to get an advantage.", level: 5 },
    { word: "Cacophony", meaning: "An unpleasant mixture of loud sounds.", level: 5 },
    { word: "Serendipity", meaning: "The fact of finding interesting or valuable things by chance.", level: 5 },
    { word: "Eloquent", meaning: "Giving a clear, strong message; expressing ideas clearly and well.", level: 5 }
  ];

  // --- Game Logic ---
  let currentQuestions = [];
  let currentQIndex = 0;
  let score = 0;
  let isAnswering = false;

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function startApp() {
    initAudio();
    startBGM();
    showScreen('level-screen');
  }

  function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
      randomIndex = Math.floor(Math.random() * currentIndex);
      currentIndex--;
      [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
  }

  function selectLevel(level) {
    document.getElementById('game-header').innerText = `Level ${level}`;
    
    // 該当レベルの問題を抽出
    currentQuestions = wordsData.filter(q => q.level === level);
    currentQuestions = shuffle(currentQuestions);
    
    currentQIndex = 0;
    score = 0;
    
    showScreen('game-screen');
    loadQuestion();
  }

  function loadQuestion() {
    isAnswering = false;
    document.getElementById('q-counter').innerText = `Q: ${currentQIndex + 1} / ${currentQuestions.length}`;
    document.getElementById('score-display').innerText = `Score: ${score}`;
    
    const qData = currentQuestions[currentQIndex];
    document.getElementById('question-word').innerText = qData.word;
    
    // 不正解のダミー選択肢を「全データの中から正解以外」から3つランダムに選ぶ
    const otherMeanings = wordsData
      .filter(item => item.word !== qData.word)
      .map(item => item.meaning);
    
    const shuffledOthers = shuffle(otherMeanings);
    const choices = [qData.meaning, shuffledOthers[0], shuffledOthers[1], shuffledOthers[2]];
    
    // 選択肢をシャッフル
    const finalChoices = shuffle(choices);
    
    const container = document.getElementById('choices-container');
    container.innerHTML = '';
    
    finalChoices.forEach(choiceText => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerText = choiceText;
      btn.onclick = () => checkAnswer(choiceText, qData.meaning, btn);
      container.appendChild(btn);
    });
  }

  function checkAnswer(selected, correct, btnElement) {
    if (isAnswering) return;
    isAnswering = true;
    
    const feedback = document.getElementById('feedback');
    
    if (selected === correct) {
      score++;
      playSE('correct');
      btnElement.style.backgroundColor = '#d4edda';
      btnElement.style.borderColor = '#28a745';
      feedback.innerText = '⭕️';
      feedback.className = 'feedback correct show';
    } else {
      playSE('wrong');
      btnElement.style.backgroundColor = '#f8d7da';
      btnElement.style.borderColor = '#dc3545';
      feedback.innerText = '❌';
      feedback.className = 'feedback wrong show';
    }
    
    setTimeout(() => {
      feedback.className = 'feedback'; // アニメーションリセット
      currentQIndex++;
      if (currentQIndex < currentQuestions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    }, 1000);
  }

  function showResult() {
    document.getElementById('final-score').innerText = `${score} / ${currentQuestions.length}`;
    let msg = "";
    if (score === currentQuestions.length) msg = "Perfect! Excellent job!!🎉";
    else if (score >= currentQuestions.length / 2) msg = "Great job! Keep it up!👍";
    else msg = "Good effort! Let's try again!💪";
    
    document.getElementById('result-message').innerText = msg;
    showScreen('result-screen');
  }
</script>
</body>
</html>
