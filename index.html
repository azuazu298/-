<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>minimo-ww</title>
    <style>
        /* CSS変数の定義 */
        :root {
            --primary-color: #4A90E2;
            --correct-color: #2ECC71;
            --incorrect-color: #E74C3C;
            --bg-color: #F5F7FA;
            --text-color: #333333;
            --container-bg: #FFFFFF;
        }

        /* ページ全体のリセットとスマホ1画面収容の設定 */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* 1画面に収める */
            overflow: hidden; /* スクロール禁止 */
        }

        /* アプリコンテナ */
        #app {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 600px;
            background: var(--container-bg);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* 画面ごとのセクション設定 */
        .screen {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 15px 20px;
            box-sizing: border-box;
        }
        .screen.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1, h2 { text-align: center; margin: 10px 0; }

        /* ボタン共通スタイル */
        .btn {
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            transition: transform 0.1s, opacity 0.2s;
            margin: 10px auto;
            display: block;
            letter-spacing: 1px;
            font-weight: bold;
        }
        .btn:active { transform: scale(0.97); }
        .btn.primary { background-color: var(--primary-color); color: white; }
        .btn.secondary { background-color: #ddd; color: #333; }
        .btn:disabled { cursor: not-allowed; opacity: 0.5; }

        /* ゲーム画面のヘッダー */
        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 14px;
        }
        .header-left {
            display: flex;
            flex-direction: column;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            color: #555;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* タイマー */
        .timer-container {
            width: 100%;
            height: 6px;
            background-color: #eee;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 5px;
        }
        #timer-bar {
            height: 100%;
            width: 100%;
            background-color: var(--primary-color);
            transition: width 0.1s linear, background-color 0.3s;
        }
        #timer-text {
            text-align: right;
            font-size: 12px;
            font-weight: bold;
            color: #666;
            margin-bottom: 10px;
        }

        /* 問題文（英単語）エリア */
        .question-container {
            flex: 1; /* 余白を埋める */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
            margin-bottom: 15px;
        }
        #question-word {
            font-size: clamp(32px, 8vw, 48px);
            font-weight: bold;
            color: var(--primary-color);
            text-align: center;
            word-break: break-word;
        }

        /* 選択肢（英英訳）グリッド */
        .choices-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
            flex: 2;
        }
        .choice-btn {
            flex: 1; /* 高さを均等に */
            padding: 10px 15px;
            font-size: clamp(13px, 3.5vw, 15px);
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            line-height: 1.3;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }
        .choice-btn:active { transform: scale(0.98); }

        /* フィードバック演出 */
        #feedback-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 100;
        }
        .feedback-mark {
            font-size: 120px;
            font-weight: bold;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .feedback-mark.show {
            opacity: 0.9;
            transform: scale(1);
        }
        .mark-correct { color: var(--correct-color); }
        .mark-incorrect { color: var(--incorrect-color); }

        /* スコア画面 */
        .score-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 30px 0;
            flex: 1;
        }
        .score-label { font-size: 20px; color: #555; font-weight: bold; }
        #final-score { font-size: 64px; color: var(--primary-color); font-weight: bold; line-height: 1; margin: 10px 0; }
        #score-comment { font-size: 16px; color: #666; text-align: center; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="app">
        <!-- ホーム画面 -->
        <section id="screen-home" class="screen active" style="justify-content: center;">
            <h1 style="font-size: 36px; color: var(--primary-color); margin-bottom: 5px;">minimo-ww</h1>
            <p style="text-align: center; color: #666; margin-bottom: 40px; font-weight: bold;">English Definition Quiz</p>
            <button id="btn-start" class="btn primary">Game Start</button>
        </section>

        <!-- ゲーム画面 -->
        <section id="screen-game" class="screen">
            <div class="header-info">
                <div class="header-left">
                    <span id="question-counter">Q: 1 / 30</span>
                    <span id="difficulty-display">Level: 1</span>
                </div>
                <div class="header-right">
                    <button id="btn-sound" class="icon-btn" title="Toggle Sound">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        </svg>
                    </button>
                    <button id="btn-exit" class="icon-btn" title="Exit">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>
            
            <div class="timer-container"><div id="timer-bar"></div></div>
            <div id="timer-text">30.0</div>

            <div class="question-container">
                <div id="question-word">Loading...</div>
            </div>

            <div id="choices-container" class="choices-grid"></div>

            <!-- フィードバック演出用 -->
            <div id="feedback-overlay">
                <div id="feedback-mark" class="feedback-mark"></div>
            </div>
        </section>

        <!-- リザルト画面 -->
        <section id="screen-result" class="screen">
            <h2>Result</h2>
            <div class="score-display">
                <span class="score-label">Total Score</span>
                <span id="final-score">0</span>
                <span class="score-label" style="font-size:14px; margin-top:5px;">/ 990 pts</span>
                <p id="score-comment" style="margin-top:20px;"></p>
            </div>
            <button id="btn-home-from-result" class="btn primary">Back to Home</button>
        </section>
    </div>

<script>
/* =========================================================
   サウンド管理 (BGM / SE)
   ※音声ファイル(mp3等)を用意する場合は、下記の変数にURLを設定してください。
   ※空欄("")の場合は、Web Audio APIを使った電子音が自動で鳴ります。
========================================================= */
const SOUND_FILES = {
    bgm: "",       // 例: "assets/bgm.mp3"
    correct: "",   // 例: "assets/correct.mp3"
    wrong: ""      // 例: "assets/wrong.mp3"
};

const SoundManager = {
    isSoundOn: true,
    audioCtx: null,
    bgmOscillators: [],
    bgmInterval: null,
    externalAudios: { bgm: null, correct: null, wrong: null },

    init() {
        if (SOUND_FILES.bgm) this.externalAudios.bgm = new Audio(SOUND_FILES.bgm);
        if (SOUND_FILES.correct) this.externalAudios.correct = new Audio(SOUND_FILES.correct);
        if (SOUND_FILES.wrong) this.externalAudios.wrong = new Audio(SOUND_FILES.wrong);
        
        if (this.externalAudios.bgm) this.externalAudios.bgm.loop = true;
        
        if (!this.audioCtx && (!SOUND_FILES.bgm || !SOUND_FILES.correct || !SOUND_FILES.wrong)) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.audioCtx = new AudioContext();
        }
    },
    toggle() {
        this.isSoundOn = !this.isSoundOn;
        if (!this.isSoundOn) this.stopBGM();
        else this.startBGM();
        return this.isSoundOn;
    },
    startBGM() {
        if (!this.isSoundOn) return;
        if (this.audioCtx && this.audioCtx.state === 'suspended') this.audioCtx.resume();
        
        if (this.externalAudios.bgm) {
            this.externalAudios.bgm.play().catch(e => console.log(e));
        } else if (this.audioCtx && !this.bgmInterval) {
            // 内蔵BGMジェネレータ（シンプルなループ）
            const notes = [261.63, 329.63, 392.00, 523.25]; // C, E, G, C
            let step = 0;
            this.bgmInterval = setInterval(() => {
                if(!this.isSoundOn) return;
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = notes[step % notes.length] / 2;
                osc.connect(gain);
                gain.connect(this.audioCtx.destination);
                gain.gain.setValueAtTime(0.015, this.audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(this.audioCtx.currentTime + 0.4);
                step++;
            }, 600);
        }
    },
    stopBGM() {
        if (this.externalAudios.bgm) this.externalAudios.bgm.pause();
        if (this.bgmInterval) { clearInterval(this.bgmInterval); this.bgmInterval = null; }
    },
    playSE(type) {
        if (!this.isSoundOn) return;
        
        if (this.externalAudios[type]) {
            this.externalAudios[type].currentTime = 0;
            this.externalAudios[type].play().catch(e=>console.log(e));
            return;
        }
        
        if (!this.audioCtx) return;
        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();
        osc.connect(gain);
        gain.connect(this.audioCtx.destination);
        
        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, this.audioCtx.currentTime); 
            osc.frequency.setValueAtTime(1108.73, this.audioCtx.currentTime + 0.1); 
            gain.gain.setValueAtTime(0.3, this.audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(this.audioCtx.currentTime + 0.5);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, this.audioCtx.currentTime);
            osc.frequency.setValueAtTime(100, this.audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, this.audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(this.audioCtx.currentTime + 0.4);
        }
    }
};


/* =========================================================
   問題データ (30問: 難易度1〜5 各6問)
========================================================= */
const allWordsData = [
    // Level 1
    { word: "Apple", meaning: "A round fruit with red or green skin and a whitish interior.", level: 1 },
    { word: "Dog", meaning: "A common animal with four legs, often kept by people as a pet.", level: 1 },
    { word: "Book", meaning: "A set of printed pages, bound together in a cover.", level: 1 },
    { word: "Water", meaning: "A clear liquid, without colour or taste, that falls from the sky as rain.", level: 1 },
    { word: "Sun", meaning: "The star that provides light and heat for the earth.", level: 1 },
    { word: "Happy", meaning: "Feeling, showing, or causing pleasure or satisfaction.", level: 1 },
    // Level 2
    { word: "Beautiful", meaning: "Very attractive to look at.", level: 2 },
    { word: "Quickly", meaning: "At a fast speed.", level: 2 },
    { word: "Journey", meaning: "The act of travelling from one place to another.", level: 2 },
    { word: "Friend", meaning: "A person who you know well and who you like a lot.", level: 2 },
    { word: "Important", meaning: "Necessary or of great value.", level: 2 },
    { word: "Decide", meaning: "To choose something, especially after thinking carefully.", level: 2 },
    // Level 3
    { word: "Environment", meaning: "The air, water, and land in or on which people, animals, and plants live.", level: 3 },
    { word: "Experience", meaning: "Knowledge or skill from doing, seeing, or feeling things.", level: 3 },
    { word: "Participate", meaning: "To take part in or become involved in an activity.", level: 3 },
    { word: "Opportunity", meaning: "An occasion or situation that makes it possible to do something.", level: 3 },
    { word: "Communicate", meaning: "To share information with others by speaking, writing, or using signals.", level: 3 },
    { word: "Develop", meaning: "To grow or change into a more advanced, larger, or stronger form.", level: 3 },
    // Level 4
    { word: "Consequently", meaning: "As a result.", level: 4 },
    { word: "Significant", meaning: "Important or noticeable.", level: 4 },
    { word: "Implement", meaning: "To start using a plan or system.", level: 4 },
    { word: "Emphasize", meaning: "To show that something is very important or worth giving attention to.", level: 4 },
    { word: "Contradict", meaning: "To say the opposite of what someone else has said.", level: 4 },
    { word: "Ambiguous", meaning: "Having or expressing more than one possible meaning.", level: 4 },
    // Level 5
    { word: "Ubiquitous", meaning: "Seeming to be everywhere.", level: 5 },
    { word: "Ephemeral", meaning: "Lasting for only a short time.", level: 5 },
    { word: "Sycophant", meaning: "Someone who praises powerful people in a way that is not sincere to get an advantage.", level: 5 },
    { word: "Cacophony", meaning: "An unpleasant mixture of loud sounds.", level: 5 },
    { word: "Serendipity", meaning: "The fact of finding interesting or valuable things by chance.", level: 5 },
    { word: "Eloquent", meaning: "Giving a clear, strong message; expressing ideas clearly and well.", level: 5 }
];


/* =========================================================
   ゲームロジック
========================================================= */
let currentQuestions = [];
let currentQIndex = 0;
let score = 0;
let isAnswering = false;
let timerInterval;
let timeLeft;
const TIME_LIMIT = 30; // 制限時間30秒
const POINTS_PER_LEVEL = 11; // 満点990を配分: 全問正解時の合計=990 (各レベルの配点は レベル×11点)

const screens = {
    home: document.getElementById('screen-home'),
    game: document.getElementById('screen-game'),
    result: document.getElementById('screen-result')
};

function switchScreen(screenName) {
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[screenName].classList.add('active');
}

function shuffle(array) {
    return array.slice().sort(() => Math.random() - 0.5);
}

// ゲーム開始
function startGame() {
    SoundManager.init();
    SoundManager.startBGM();

    let selected = [];
    // レベル1〜5を各6問抽出
    for (let i = 1; i <= 5; i++) {
        let diffQuestions = allWordsData.filter(q => q.level === i);
        selected = selected.concat(shuffle(diffQuestions).slice(0, 6));
    }
    
    // 難易度順に並べる
    currentQuestions = selected.sort((a, b) => a.level - b.level);
    
    currentQIndex = 0;
    score = 0;
    
    switchScreen('game');
    loadQuestion();
}

// 問題表示
function loadQuestion() {
    isAnswering = false;
    clearInterval(timerInterval);
    timeLeft = TIME_LIMIT;
    updateTimerUI();

    const q = currentQuestions[currentQIndex];
    document.getElementById('question-counter').textContent = `Q: ${currentQIndex + 1} / 30`;
    document.getElementById('difficulty-display').textContent = `Level: ${q.level}`;
    document.getElementById('question-word').textContent = q.word;

    // 不正解のダミー選択肢を全体のリストから3つランダムに選定
    const otherMeanings = allWordsData
        .filter(item => item.word !== q.word)
        .map(item => item.meaning);
    
    const shuffledOthers = shuffle(otherMeanings);
    const choices = [q.meaning, shuffledOthers[0], shuffledOthers[1], shuffledOthers[2]];
    const finalChoices = shuffle(choices);

    const container = document.getElementById('choices-container');
    container.innerHTML = '';

    finalChoices.forEach(choiceText => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = choiceText;
        btn.onclick = () => handleAnswer(choiceText === q.meaning, btn);
        container.appendChild(btn);
    });

    // タイマー開始
    timerInterval = setInterval(() => {
        timeLeft -= 0.1;
        updateTimerUI();
        if (timeLeft <= 0) {
            timeLeft = 0;
            updateTimerUI();
            handleAnswer(false, null, true); // タイムアウト
        }
    }, 100);
}

function updateTimerUI() {
    const textEl = document.getElementById('timer-text');
    const barEl = document.getElementById('timer-bar');
    
    textEl.textContent = Math.ceil(timeLeft) + ".0";
    const percent = (timeLeft / TIME_LIMIT) * 100;
    barEl.style.width = `${percent}%`;

    if (percent <= 20) barEl.style.backgroundColor = 'var(--incorrect-color)';
    else barEl.style.backgroundColor = 'var(--primary-color)';
}

// 解答判定と演出
function handleAnswer(isCorrect, btnElement, isTimeout = false) {
    if (isAnswering) return;
    isAnswering = true;
    clearInterval(timerInterval);

    const q = currentQuestions[currentQIndex];
    const mark = document.getElementById('feedback-mark');

    if (isCorrect) {
        score += q.level * POINTS_PER_LEVEL;
        SoundManager.playSE('correct');
        if (btnElement) {
            btnElement.style.backgroundColor = '#d4edda';
            btnElement.style.borderColor = '#28a745';
        }
        mark.textContent = '⭕️';
        mark.className = 'feedback-mark mark-correct show';
    } else {
        SoundManager.playSE('wrong');
        if (btnElement) {
            btnElement.style.backgroundColor = '#f8d7da';
            btnElement.style.borderColor = '#dc3545';
        }
        mark.textContent = isTimeout ? '⏰' : '❌';
        mark.className = 'feedback-mark mark-incorrect show';
        
        // 正解のボタンをハイライト
        const buttons = document.querySelectorAll('.choice-btn');
        buttons.forEach(b => {
            if (b.textContent === q.meaning) {
                b.style.border = '2px solid var(--correct-color)';
                b.style.backgroundColor = '#f0fff4';
            }
        });
    }

    // 演出後、次の問題またはリザルトへ
    setTimeout(() => {
        mark.className = 'feedback-mark';
        currentQIndex++;
        if (currentQIndex < currentQuestions.length) {
            loadQuestion();
        } else {
            finishGame();
        }
    }, 1200);
}

// ゲーム終了・リザルト
function finishGame() {
    clearInterval(timerInterval);
    SoundManager.stopBGM();
    
    document.getElementById('final-score').textContent = score;
    let comment = "";
    if (score === 990) comment = "Perfect Score! Excellent!!🎉";
    else if (score >= 700) comment = "Great job! Very high score!👍";
    else if (score >= 400) comment = "Good effort! Keep practicing!💪";
    else comment = "Let's review and try again!📚";
    
    document.getElementById('score-comment').textContent = comment;
    switchScreen('result');
}

/* =========================================================
   イベントリスナーの登録
========================================================= */
document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-home-from-result').addEventListener('click', () => switchScreen('home'));

document.getElementById('btn-exit').addEventListener('click', () => {
    if (confirm("Are you sure you want to quit and view your score?")) {
        finishGame();
    }
});

document.getElementById('btn-sound').addEventListener('click', (e) => {
    const isOn = SoundManager.toggle();
    e.currentTarget.style.opacity = isOn ? "1" : "0.5";
});

</script>
</body>
</html>
